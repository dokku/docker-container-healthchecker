---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    env:
      GITHUB_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
      PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}

    steps:
      - uses: actions/checkout@v7
      - name: make version
        run: |
          make version .env.docker
      - run: make ci-report
      - run: make build-docker-image
      - run: make build-in-docker
      - run: make validate-in-docker
      - name: upload packages
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: build/**/*

  binary-check:
    name: binary-check
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: Get Repository Name
        id: repo-name
        run: |
          echo "REPOSITORY_NAME=$(echo "${{ github.repository }}" | cut -d '/' -f 2)" >> $GITHUB_OUTPUT
          echo "TARGET_ARCHITECTURE=$(dpkg --print-architecture)" >> $GITHUB_OUTPUT
      # built the way a release is, without cgo
      - name: Build binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH="${{ steps.repo-name.outputs.TARGET_ARCHITECTURE }}" go build -v -trimpath \
            -ldflags "-s -w -X main.Version=${{ github.ref_name }}" \
            -o "dist/${{ steps.repo-name.outputs.REPOSITORY_NAME }}-linux-${{ steps.repo-name.outputs.TARGET_ARCHITECTURE }}"
      # a binary linked against a newer glibc does not start on ubuntu:20.04,
      # and prints nothing to stdout there
      - name: Check version
        run: |
          version="$(docker run --rm --volume "$PWD/dist:/dist:ro" ubuntu:20.04 "/dist/${{ steps.repo-name.outputs.REPOSITORY_NAME }}-linux-${{ steps.repo-name.outputs.TARGET_ARCHITECTURE }}" version)"
          if [[ -z "$version" ]]; then
            echo "binary reported an empty version on ubuntu:20.04"
            exit 1
          fi

          echo "binary reports $version on ubuntu:20.04"
